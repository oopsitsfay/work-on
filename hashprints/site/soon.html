<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/icon.png">
<title>HashPrints</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0c0e; --line: #24262c; --text: #f4f5f7; --muted: #7d828d; --accent: #c6ff00; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 "Space Grotesk", system-ui, sans-serif; display: grid; place-items: center; padding: 24px;
    background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size: 32px 32px; }
  main { text-align: center; max-width: 520px; }
  .logo { font: 800 clamp(28px, 7vw, 44px) "JetBrains Mono", monospace; letter-spacing: -.02em; }
  .logo span { color: var(--accent); }
  h1 { font-size: clamp(28px, 6vw, 40px); margin: 28px 0 10px; letter-spacing: -.02em; }
  p { color: var(--muted); margin: 0 0 28px; }
  a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--accent); font: 14px "JetBrains Mono", monospace; }
</style>
</head>
<body>
<main>
  <div class="logo">HASH<span>/</span>PRINTS</div>
  <h1>Coming soon.</h1>
  <p>3,333 pixel prints, each mined from a hash on Ethereum.</p>
  <a href="https://x.com/hashprintsnft" target="_blank" rel="noopener">@hashprintsnft</a>
</main>
</body>
</html>
